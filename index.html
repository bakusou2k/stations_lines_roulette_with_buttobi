    width: 100%;
    height: 100%;

    opacity: 0;
    pointer-events: none;

}

#fadeOverlay.active {

}

let step = 0;
let selectedRoute = "";
let interval = null;

const lineElement = document.getElementById("line");
const stationElement = document.getElementById("station");
const button = document.getElementById("roulette");

const mainScreen = document.getElementById("mainScreen");
const buttobiScreen = document.getElementById("buttobiScreen");

const buttobiareaElement =
    document.getElementById("buttobiarea");

const buttobiButton =
    document.getElementById("buttobiButton");

/* =====================
   メインルーレット
===================== */

button.addEventListener("click", () => {

    if (interval) {

        clearInterval(interval);
        interval = null;

        if (step === 0) {

            // 路線決定
            const routeNames = Object.keys(routes);

            selectedRoute =
                routeNames[Math.floor(
                    Math.random() * routeNames.length
                )];

            lineElement.textContent =
                "選ばれた路線: " + selectedRoute;
                
            // 40%でぶっ飛びルーレットへ
            if (Math.random() < 0.4) {

                button.disabled = true;

                const fadeOverlay = document.getElementById("fadeOverlay");

                // 画面を暗転
                fadeOverlay.classList.add("active");

                // 暗転が完了した頃に画面を切り替える
                setTimeout(() => {

                    mainScreen.style.display = "none";
                    buttobiScreen.style.display = "block";

                // 明転
                    fadeOverlay.classList.remove("active");

                    button.disabled = false;

                }, 900);

        } else {
            
                stationElement.textContent =
                    "駅を選択";
                
                step = 1;
            }



        } else if (step === 2) {

            // 駅決定
            const stations =
                routes[selectedRoute];

            const selectedStation =
                stations[Math.floor(
                    Math.random() * stations.length
                )];

            stationElement.textContent =
                "選ばれた駅: " + selectedStation;

            button.disabled = true;

                step = 3;
                button.disabled = false;

        }

        button.textContent = "ルーレット開始";

    } else {

        if (step === 0) {

            // 路線ルーレット開始
            interval = setInterval(() => {

                const routeNames =
                    Object.keys(routes);

                const randomRoute =
                    routeNames[Math.floor(
                        Math.random() *
                        routeNames.length
                    )];

                lineElement.textContent =
                    "選ばれた路線: " + randomRoute;

            }, 15);

            button.textContent = "ストップ";

        } else if (step === 1) {

            // 駅ルーレット開始
            interval = setInterval(() => {

                const stations =
                    routes[selectedRoute];

                const randomStation =
                    stations[Math.floor(
                        Math.random() *
                        stations.length
                    )];

                stationElement.textContent =
                    "選ばれた駅: " + randomStation;

            }, 15);

            step = 2;

            button.textContent = "ストップ";

        } else if (step === 3) {

            // リセット
            lineElement.textContent =
                "路線を選択";

            stationElement.textContent =
                "駅を選択";

            selectedRoute = "";

            step = 0;

            button.textContent =
                "ルーレット開始";
        }
    }
});

/* =====================
   ぶっ飛びルーレット
===================== */

let buttobiInterval = null;

buttobiButton.addEventListener("click", () => {

    if (buttobiInterval) {

        // 停止
        clearInterval(buttobiInterval);
        buttobiInterval = null;

        const result =
            buttobiareas[Math.floor(
                Math.random() *
                buttobiareas.length
            )];

        buttobiareaElement.textContent =
            "ぶっ飛び先: " + result;

        buttobiButton.textContent =
            "最初に戻る";

    } else {

        // 「最初に戻る」
        if (buttobiButton.textContent === "最初に戻る") {

            buttobiScreen.style.display = "none";
            mainScreen.style.display = "block";

            lineElement.textContent =
                "路線を選択";

            stationElement.textContent =
                "駅を選択";

            selectedRoute = "";
            step = 0;

            button.disabled = false;
            button.textContent =
                "ルーレット開始";

            buttobiareaElement.textContent =
                "ぶっ飛び先を選択";

            buttobiButton.textContent =
                "ルーレット開始";

            return;
        }

        // ぶっ飛びルーレット開始
        buttobiInterval = setInterval(() => {

            const randomStation =
                buttobiareas[Math.floor(
                    Math.random() *
                    buttobiareas.length
                )];

            buttobiareaElement.textContent =
                "ぶっ飛び先: " + randomStation;

        }, 15);

        buttobiButton.textContent =
            "ストップ";
    }

});
